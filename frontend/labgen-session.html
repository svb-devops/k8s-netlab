<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实验进行中 — K8S NetLab</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind-config.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- xterm.js — same versions/SRI as index.html -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
          integrity="sha384-LJcOxlx9IMbNXDqJ2axpfEQKkAYbFjJfhXexLfiRJhjDU81mzgkiQq8rkV0j6dVh" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"
            integrity="sha384-/nfmYPUzWMS6v2atn8hbljz7NE0EI1iGx34lJaNzyVjWGDzMv+ciUZUeJpKA3Glc" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"
            integrity="sha384-AQLWHRKAgdTxkolJcLOELg4E9rE89CPE2xMy3tIRFn08NcGKPTsELdvKomqji+DL" crossorigin="anonymous"></script>

    <!-- Shared styles (doc-drawer, step-pill, lab-panel etc.) -->
    <link rel="stylesheet" href="/css/app.css?v=20260628">

    <style>
        /* Full-viewport layout — terminal fills all available height */
        html, body {
            height: 100%;
            overflow: hidden;
        }
        #session-body-row {
            /* flex-1 fills remaining height below header; drawer + terminal
               sit side by side so opening the drawer resizes the terminal
               instead of covering it (desktop only — see media query below) */
            display: flex;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }
        #session-terminal-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0;
        }
        #kubectl-terminal-container {
            flex: 1;
            overflow: hidden;
            /* min-height allows xterm.js fitAddon to measure correctly */
            min-height: 0;
        }
        #kubectl-terminal-container .xterm {
            padding: 6px 10px;
        }
        #kubectl-terminal-container .xterm-viewport {
            border-radius: 0 0 4px 4px;
        }

        /* ── Lab Steps Drawer: desktop = resizable sidebar (pushes the terminal,
           no backdrop needed since it no longer covers anything); mobile = the
           shared .doc-drawer fixed-overlay behavior from app.css (not enough
           width for two columns). ID selectors here intentionally out-specificity
           the shared .doc-drawer class from app.css, scoped to this page only. ── */
        #lab-drawer {
            position: static;
            flex-shrink: 0;
            width: 0;
            max-width: 92vw;
            height: auto;
            box-shadow: none;
            border-right: 1px solid #232C3D;
            transform: none;
            transition: width 0.25s ease-in-out;
        }
        #lab-drawer.drawer-open {
            width: 440px;
        }
        #lab-drawer-backdrop {
            display: none;
        }
        @media (max-width: 768px) {
            #lab-drawer {
                position: fixed;
                top: 0;
                left: 0;
                height: 100vh;
                width: 100vw;
                max-width: 100vw;
                box-shadow: 4px 0 32px rgba(0, 0, 0, 0.18);
                transform: translateX(-100%);
            }
            #lab-drawer.drawer-open {
                width: 100vw;
                transform: translateX(0);
            }
            #lab-drawer-backdrop {
                display: block;
            }
        }
    </style>
</head>

<body class="theme-dark flex flex-col bg-devops-bg font-plex" style="height:100vh;overflow:hidden;">

<!-- ── Header ── -->
<header class="flex-shrink-0 bg-devops-surface border-b border-devops-border">
    <div class="flex items-center justify-between px-4 py-3">
        <!-- Left: back link + lab title -->
        <div class="flex items-center gap-3 min-w-0">
            <a href="/labgen-catalog.html"
               class="flex-shrink-0 text-sm text-devops-muted hover:text-k8s-blue transition flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
                实验目录
            </a>
            <span class="flex-shrink-0 text-devops-border-strong">|</span>
            <h1 id="session-lab-title"
                class="text-sm font-semibold text-devops-text truncate">加载中…</h1>
        </div>

        <!-- Right: status badge + drawer toggle + username -->
        <div class="flex-shrink-0 flex items-center gap-3">
            <span id="session-status-badge"></span>

            <!-- "实验步骤" drawer toggle — matches index.html's btn-toggle-drawer style -->
            <button id="btn-toggle-drawer"
                    class="text-xs text-devops-muted hover:text-k8s-blue border border-devops-border-strong hover:border-k8s-blue
                           px-3 py-1.5 rounded-lg font-medium transition duration-200 flex items-center gap-1.5">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                实验步骤
            </button>

            <span id="session-username" class="text-xs font-plex-mono text-devops-muted"></span>
        </div>
    </div>
</header>

<!-- ── Body row: Lab Steps Drawer (left sidebar) + terminal (fills rest) ── -->
<div id="session-body-row">

    <!-- ══════════════════════════════════════════════════════════════════
         Lab Steps Drawer — desktop: resizable sidebar next to the terminal;
         mobile: falls back to fixed overlay (see <style> media query above).
         Reuses doc-drawer / drawer-backdrop / step-pill CSS from app.css.
         ══════════════════════════════════════════════════════════════════ -->
    <div id="lab-drawer" class="doc-drawer" role="dialog" aria-label="实验步骤">

        <!-- Row 1: 实验步骤 / 实验背景 tabs + close -->
        <div class="flex-shrink-0 flex items-stretch border-b border-devops-border bg-devops-surface">
            <button id="drawer-tab-steps"
                    class="tab-btn text-xs px-4 py-2.5 font-medium border-b-2 border-k8s-blue text-k8s-blue bg-devops-surface-2">
                实验步骤
            </button>
            <button id="drawer-tab-background"
                    class="tab-btn text-xs px-4 py-2.5 font-medium border-b-2 border-transparent text-devops-muted hover:text-devops-text hover:bg-devops-surface-2 transition">
                实验背景
            </button>
            <button id="btn-close-drawer"
                    class="ml-auto px-3 text-devops-faint hover:text-devops-text hover:bg-devops-surface-2 transition"
                    title="关闭面板">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Row 2: Progress bar + step pills -->
        <div class="flex-shrink-0 px-3 pt-2 pb-1 border-b border-devops-border">
            <div class="flex items-center justify-between mb-1">
                <span class="text-xs font-medium text-devops-muted">实验进度</span>
                <span id="drawer-progress-text" class="text-xs font-plex-mono text-devops-muted">0/0 完成</span>
            </div>
            <div class="w-full bg-devops-surface-2 rounded-full h-1">
                <div id="drawer-progress-bar"
                     class="bg-k8s-blue h-1 rounded-full transition-all duration-300"
                     style="width:0%"></div>
            </div>
            <!-- Step pills -->
            <div id="drawer-step-pills"
                 class="flex flex-wrap gap-1 pt-2 pb-1 max-h-16 overflow-y-auto"></div>
        </div>

        <!-- View: 实验步骤 (default) -->
        <div id="drawer-steps-content"
             class="flex-1 overflow-y-auto p-4 text-sm">
            <!-- Populated by labgen-session-init.js via renderSessionView() -->
        </div>

        <!-- View: 实验背景 (hidden by default) -->
        <div id="drawer-background-content"
             class="hidden flex-1 overflow-y-auto p-4 text-sm text-devops-text/90">
            <!-- Populated by labgen-session-init.js -->
        </div>

        <!-- Fixed action footer -->
        <div class="flex-shrink-0 border-t border-devops-border bg-devops-surface p-3 space-y-2">
            <button id="btn-check-step" data-action="check-step" disabled
                    class="w-full px-4 py-2 rounded text-sm font-medium bg-devops-surface-2 text-devops-faint cursor-not-allowed transition">
                检查当前步骤
            </button>
            <div class="flex gap-2">
                <button id="btn-complete" data-action="complete" data-ready="false" disabled
                        class="flex-1 px-4 py-2 rounded text-sm font-medium bg-devops-surface-2 text-devops-faint cursor-not-allowed transition">
                    完成实验
                </button>
                <button id="btn-abort" data-action="abort" disabled
                        class="flex-1 px-4 py-2 rounded text-sm font-medium bg-devops-surface-2 text-devops-faint cursor-not-allowed transition">
                    中止实验
                </button>
            </div>
            <p id="action-error" class="hidden text-red-400 text-xs text-center"></p>
        </div>

    </div><!-- end lab-drawer -->

    <!-- Drawer backdrop — only rendered on mobile (see media query above) -->
    <div id="lab-drawer-backdrop" class="drawer-backdrop"></div>

    <!-- ── Terminal area (fills remaining width) ── -->
    <main id="session-terminal-wrap">

        <!-- Loading / non-active-state message (shown when terminal not connected) -->
        <div id="session-message-area"
             class="flex-1 flex flex-col items-center justify-center text-devops-muted h-full font-plex">
            <div class="loading mb-4" style="border-color:#232C3D;border-top-color:#326CE5;"></div>
            <p id="session-message-text" class="text-sm">正在加载实验环境…</p>
        </div>

        <!-- kubectl terminal panel (shown when LAB_ACTIVE) -->
        <div id="kubectl-terminal-panel" class="hidden flex-col h-full">
            <!-- macOS-style title bar -->
            <div class="flex-shrink-0 flex items-center px-3 py-2 bg-devops-surface border-b border-devops-border">
                <div class="flex space-x-1.5 mr-3">
                    <div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-yellow-500"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-green-500"></div>
                </div>
                <span class="text-xs font-plex-mono font-semibold text-green-400">$ kubectl</span>
                <span class="text-xs text-devops-muted ml-1.5 font-plex">Lab Terminal</span>
                <span id="kubectl-terminal-ns-badge"
                      class="hidden ml-3 text-xs font-plex-mono text-cyan-300"></span>
            </div>

            <!-- Security notice — real banner (not printed into the terminal buffer,
                 which caused ragged/unaligned text wrapping at arbitrary widths) -->
            <div class="flex-shrink-0 flex items-center gap-2 px-3 py-1.5 bg-amber-500/10 border-b border-amber-500/25">
                <svg class="w-3.5 h-3.5 flex-shrink-0 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l6.518 11.598c.75 1.334-.213 2.98-1.742 2.98H3.48c-1.53 0-2.492-1.646-1.743-2.98L8.257 3.1zM11 14a1 1 0 11-2 0 1 1 0 012 0zm-.25-6.5a.75.75 0 00-1.5 0v3.5a.75.75 0 001.5 0v-3.5z" clip-rule="evenodd"/>
                </svg>
                <span class="text-xs text-amber-300 font-plex">请仅在本实验范围内使用该终端，不要输入真实密码、Token、API Key 或私钥。</span>
            </div>

            <!-- xterm.js mount point (flex-1 fills remaining height) -->
            <div id="kubectl-terminal-container" class="bg-devops-bg"></div>
        </div>
    </main>

</div><!-- end session-body-row -->


<script type="module" src="/js/labgen-session-init.js?v=20260628"></script>
</body>
</html>
