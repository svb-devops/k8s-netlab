<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 — K8S NetLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        .prose h1,.prose h2,.prose h3{font-weight:700;margin-top:1.5em;margin-bottom:.5em;color:#fff}
        .prose h1{font-size:1.75rem}.prose h2{font-size:1.35rem}.prose h3{font-size:1.1rem}
        .prose p{margin-bottom:1em;line-height:1.8;color:#c3cbdc}
        .prose ul,.prose ol{margin-left:1.5em;margin-bottom:1em;color:#c3cbdc}
        .prose li{margin-bottom:.4em}
        .prose code{background:#1a2233;border:1px solid #2e3a52;padding:2px 6px;border-radius:4px;font-size:.875em;font-family:'JetBrains Mono',monospace;color:#a8c7ff}
        .prose pre{background:#0d1220;color:#d6e4ff;padding:1.25em;overflow-x:auto;margin:0;border-radius:0 0 .55rem .55rem}
        .prose pre code{background:none;border:none;padding:0;color:inherit;font-size:.875em;font-family:'JetBrains Mono',monospace}
        /* Terminal-window chrome wrapping each rendered code block — see
           article.js::_enhanceCodeBlocks(). Purely decorative post-processing
           of already-sanitized DOM nodes. */
        .term{border:1px solid #232c3d;border-radius:.6rem;overflow:hidden;margin-bottom:1.25em;box-shadow:0 8px 24px -14px rgba(0,0,0,.6)}
        .term-bar{display:flex;align-items:center;gap:.4rem;padding:.5rem .7rem;background:#121826;border-bottom:1px solid #232c3d}
        .term-dot{width:9px;height:9px;border-radius:50%}
        .term-dot-r{background:#ef4444}.term-dot-y{background:#f59e0b}.term-dot-g{background:#22c55e}
        .term-label{margin-left:.4rem;font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.03em;color:#5b6478}
        .hl-bad{color:#f87171}
        .prose table{border-collapse:collapse;width:100%;margin-bottom:1em}
        .prose th,.prose td{border:1px solid #232c3d;padding:.5em .75em;text-align:left}
        .prose th{background:#121826;font-weight:600;color:#e6eaf2}
        .prose td{color:#c3cbdc}
        .prose blockquote{border-left:4px solid #326CE5;padding-left:1em;color:#8b96ac;margin:1em 0;font-style:italic}
        .prose a{color:#4c82f0;text-decoration:underline}
        .prose hr{border:none;border-top:1px solid #232c3d;margin:2em 0}
        .prose strong{color:#e6eaf2}
    </style>
</head>
<body class="bg-devops-bg min-h-screen font-plex">

<!-- Nav -->
<nav class="bg-devops-surface border-b border-devops-border sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2 font-bold text-devops-text">
            <svg class="w-6 h-6 text-k8s-blue" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            K8S NetLab
        </a>
        <div id="nav-actions" class="flex items-center gap-3"></div>
    </div>
</nav>

<!-- Article -->
<main class="max-w-3xl mx-auto px-4 py-10">
    <a href="/" class="text-sm text-k8s-blue hover:underline mb-6 block">← 返回文章列表</a>

    <div id="article-container">
        <div class="text-devops-muted text-sm">加载中...</div>
    </div>

    <!-- Lab CTA block (rendered by article.js when linked lab exists) -->
    <div id="lab-cta-container"></div>

    <!-- Comments -->
    <section id="comments-section" class="mt-12 hidden">
        <h2 class="text-xl font-bold text-devops-text mb-6">评论</h2>

        <!-- Comment form -->
        <div id="comment-form-area" class="mb-8">
            <!-- filled by JS based on auth state -->
        </div>

        <!-- Comments list -->
        <div id="comments-list"></div>
    </section>
</main>

<footer class="text-center text-devops-faint text-sm py-8 border-t border-devops-border mt-8 font-plex-mono">
    © 2026 K8S NetLab
</footer>

<script src="/js/article.js"></script>
</body>
</html>
