<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员控制台 - K8S NetLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind-config.js"></script>
</head>
<body class="bg-gray-100 min-h-screen">

<!-- ── Header ── -->
<header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
        <svg class="w-8 h-8 text-k8s-blue" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <div>
            <h1 class="text-lg font-bold text-gray-900">K8S NetLab</h1>
            <p class="text-xs text-gray-500">管理员控制台</p>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <span id="auto-refresh-indicator" class="text-xs text-gray-400 hidden">自动刷新中…</span>
        <span id="last-updated" class="text-xs text-gray-400"></span>
        <button id="btn-refresh"
                class="px-3 py-1.5 text-sm bg-k8s-blue text-white rounded-lg hover:bg-blue-700 transition">
            刷新
        </button>
        <button id="btn-logout"
                class="px-3 py-1.5 text-sm border border-gray-300 text-gray-600 rounded-lg hover:bg-gray-50 transition">
            退出
        </button>
    </div>
</header>

<!-- ── Token Gate ── -->
<div id="token-gate" class="flex items-center justify-center min-h-[calc(100vh-64px)]">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-sm mx-4">
        <h2 class="text-xl font-semibold text-gray-800 mb-1">管理员验证</h2>
        <p class="text-sm text-gray-500 mb-6">输入 ADMIN_TOKEN 以访问控制台</p>
        <form id="token-form" class="space-y-4">
            <input type="password" id="token-input" required
                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-k8s-blue focus:border-transparent text-sm"
                   placeholder="粘贴 Admin Token…">
            <button type="submit"
                    class="w-full bg-k8s-blue hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition text-sm">
                进入控制台
            </button>
        </form>
        <p id="token-error" class="mt-3 text-sm text-red-600 hidden"></p>
    </div>
</div>

<!-- ── Dashboard (hidden until authenticated) ── -->
<div id="dashboard" class="hidden max-w-7xl mx-auto px-6 py-6 space-y-6">

    <!-- Stats Cards -->
    <div class="grid grid-cols-3 gap-4">
        <div class="bg-white rounded-xl shadow-sm p-5 flex items-center gap-4">
            <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center text-k8s-blue">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
            </div>
            <div>
                <p class="text-sm text-gray-500">总注册用户</p>
                <p id="stat-total-users" class="text-2xl font-bold text-gray-900">—</p>
            </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-5 flex items-center gap-4">
            <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center text-green-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M5.636 18.364a9 9 0 010-12.728m12.728 0a9 9 0 010 12.728M9 12a3 3 0 106 0 3 3 0 00-6 0z"/>
                </svg>
            </div>
            <div>
                <p class="text-sm text-gray-500">当前在线</p>
                <p id="stat-active-sessions" class="text-2xl font-bold text-gray-900">—</p>
            </div>
        </div>
        <div class="bg-white rounded-xl shadow-sm p-5 flex items-center gap-4">
            <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center text-purple-600">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </div>
            <div>
                <p class="text-sm text-gray-500">活跃 VM</p>
                <p id="stat-total-vms" class="text-2xl font-bold text-gray-900">—</p>
            </div>
        </div>
    </div>

    <!-- Sessions Table -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-gray-100 flex items-center justify-between">
            <h2 class="font-semibold text-gray-800">在线用户</h2>
            <label class="flex items-center gap-2 text-sm text-gray-500 cursor-pointer">
                <input type="checkbox" id="auto-refresh-toggle" class="rounded">
                每30秒自动刷新
            </label>
        </div>

        <!-- Empty state -->
        <div id="no-sessions" class="hidden py-16 text-center text-gray-400">
            <svg class="w-12 h-12 mx-auto mb-3 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                      d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <p>暂无在线用户</p>
        </div>

        <table id="sessions-table" class="w-full text-sm hidden">
            <thead class="bg-gray-50 text-xs text-gray-500 uppercase tracking-wider">
                <tr>
                    <th class="px-6 py-3 text-left">用户</th>
                    <th class="px-6 py-3 text-left">登录 IP / 地点</th>
                    <th class="px-6 py-3 text-left">注册时间</th>
                    <th class="px-6 py-3 text-left">登录时间</th>
                    <th class="px-6 py-3 text-left">当前实验</th>
                    <th class="px-6 py-3 text-left">最后活跃</th>
                    <th class="px-6 py-3 text-left">VM</th>
                    <th class="px-6 py-3 text-left">会话剩余</th>
                    <th class="px-6 py-3 text-left">操作</th>
                </tr>
            </thead>
            <tbody id="sessions-tbody" class="divide-y divide-gray-100"></tbody>
        </table>
    </div>
</div>

<!-- ── Reset Password Modal ── -->
<div id="reset-pwd-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-xl shadow-xl p-8 w-full max-w-sm mx-4">
        <h2 class="text-lg font-semibold text-gray-800 mb-1">重置密码</h2>
        <p class="text-sm text-gray-500 mb-5">为 <strong id="reset-target-username"></strong> 设置新密码</p>
        <form id="reset-pwd-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">新密码</label>
                <input type="password" id="reset-new-pwd" required minlength="6"
                       class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-k8s-blue focus:border-transparent"
                       placeholder="至少6个字符">
            </div>
            <div id="reset-pwd-error" class="hidden text-sm text-red-600"></div>
            <div id="reset-pwd-ok" class="hidden text-sm text-green-600"></div>
            <div class="flex gap-3">
                <button type="submit"
                        class="flex-1 bg-k8s-blue hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">
                    确认重置
                </button>
                <button type="button" id="reset-pwd-cancel"
                        class="flex-1 border border-gray-300 text-gray-600 hover:bg-gray-50 font-medium py-2 rounded-lg text-sm transition">
                    取消
                </button>
            </div>
        </form>
    </div>
</div>

<script src="/js/admin.js"></script>
</body>
</html>
