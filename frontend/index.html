<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8S NetLab - Kubernetes 网络实验平台</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config -->
    <script src="/js/tailwind-config.js"></script>

    <!-- xterm.js CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css"
          integrity="sha384-LJcOxlx9IMbNXDqJ2axpfEQKkAYbFjJfhXexLfiRJhjDU81mzgkiQq8rkV0j6dVh" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"
            integrity="sha384-/nfmYPUzWMS6v2atn8hbljz7NE0EI1iGx34lJaNzyVjWGDzMv+ciUZUeJpKA3Glc" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"
            integrity="sha384-AQLWHRKAgdTxkolJcLOELg4E9rE89CPE2xMy3tIRFn08NcGKPTsELdvKomqji+DL" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-web-links@0.9.0/lib/xterm-addon-web-links.js"
            integrity="sha384-U4fBROT3kCM582gaYiNaOSQiJbXPzd9SfR1598Y7yeGSYVBzikXrNg0XyuU+mOnl" crossorigin="anonymous"></script>

    <!-- marked.js - Markdown renderer -->
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"
            integrity="sha384-odPBjvtXVM/5hOYIr3A1dB+flh0c3wAT3bSesIOqEGmyUA4JoKf/YTWy0XKOYAY7" crossorigin="anonymous"></script>
    <!-- DOMPurify - HTML sanitizer for marked.js output -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"
            integrity="sha384-JEyTNhjM6R1ElGoJns4U2Ln4ofPcqzSsynQkmEc/KGy6336qAZl70tDLufbkla+3" crossorigin="anonymous"></script>

    <!-- highlight.js - Code syntax highlighting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark.min.css"
          integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"
            integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <svg class="w-10 h-10 text-k8s-blue" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                    <div>
                        <h1 class="text-2xl font-bold text-gray-900">K8S NetLab</h1>
                        <p class="text-sm text-gray-500">Kubernetes 网络学习实验平台</p>
                    </div>
                </div>

                <div class="flex items-center space-x-4">
                    <div id="health-indicator" class="flex items-center space-x-2 whitespace-nowrap">
                        <span class="status-dot status-stopped"></span>
                        <span id="health-status-text" class="text-sm text-gray-600">检查中...</span>
                    </div>

                    <div id="user-info" class="flex items-center space-x-2">
                        <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <span id="username-display" class="text-sm font-medium text-gray-700"></span>
                        <span id="admin-badge" class="hidden text-xs font-semibold px-2 py-0.5 bg-amber-100 text-amber-700 rounded-full border border-amber-300">管理员</span>
                        <a id="admin-panel-link" href="/admin.html" class="hidden text-xs text-k8s-blue hover:underline font-medium">控制台</a>
                    </div>

                    <!-- Password change button -->
                    <button id="btn-change-password" title="修改密码"
                            class="text-gray-500 hover:text-gray-700 px-2 py-2 rounded-lg hover:bg-gray-100 transition duration-200">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/>
                        </svg>
                    </button>

                    <button id="btn-create-vm"
                            class="bg-k8s-blue hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition duration-200 flex items-center space-x-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                        <span>创建实验环境</span>
                    </button>

                    <button id="btn-logout"
                            class="text-gray-600 hover:text-gray-900 px-3 py-2 rounded-lg hover:bg-gray-100 transition duration-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Status Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- Card: Active VMs -->
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">活跃环境</p>
                        <p id="stat-active-vms" class="text-3xl font-bold text-gray-900 mt-2">0</p>
                    </div>
                    <div class="bg-green-100 rounded-full p-3">
                        <svg class="w-6 h-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Card: Total VMs / Quota -->
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">我的环境</p>
                        <p id="stat-total-vms" class="text-3xl font-bold text-gray-900 mt-2">0</p>
                        <p id="stat-quota" class="text-xs text-gray-400 mt-1">配额: —</p>
                    </div>
                    <div class="bg-blue-100 rounded-full p-3">
                        <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Card: System Status -->
            <div class="bg-white rounded-lg shadow p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-medium text-gray-600">系统状态</p>
                        <p id="stat-system-status" class="text-lg font-semibold text-gray-900 mt-2">正常</p>
                    </div>
                    <div class="bg-purple-100 rounded-full p-3">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- VM List -->
        <div class="bg-white rounded-lg shadow">
            <div class="px-6 py-4 border-b border-gray-200">
                <div class="flex items-center justify-between">
                    <h2 class="text-lg font-semibold text-gray-900">实验环境列表</h2>
                    <button id="btn-refresh" class="text-sm text-k8s-blue hover:text-blue-700 font-medium flex items-center space-x-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        <span>刷新</span>
                    </button>
                </div>
            </div>

            <!-- VM Table -->
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50 border-b border-gray-200">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">VM ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">名称</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">状态</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">资源</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">运行时间</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">操作</th>
                        </tr>
                    </thead>
                    <tbody id="vm-list" class="bg-white divide-y divide-gray-200">
                        <!-- VM rows will be inserted here -->
                        <tr id="vm-list-empty">
                            <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                                <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
                                </svg>
                                <p class="mt-2">暂无实验环境</p>
                                <p class="text-sm text-gray-400 mt-1">点击上方"创建实验环境"按钮开始</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Lab Section: split panel (docs left 40% | terminal right 60%) -->
        <!-- Shown when a VM terminal is connected -->
        <div id="terminal-section" class="mt-8 hidden">
            <div class="bg-white rounded-lg shadow overflow-hidden lab-panel flex flex-col">
                <!-- Panel Header -->
                <div class="flex-shrink-0 px-4 py-2 bg-gray-800 flex items-center justify-between border-b border-gray-700">
                    <span class="text-sm font-medium text-gray-300">实验学习台</span>
                    <div class="flex items-center space-x-3">
                        <span id="terminal-vm-label" class="text-xs text-gray-500"></span>
                        <button id="btn-disconnect-terminal"
                                class="text-xs text-gray-400 hover:text-red-400 transition duration-150">
                            断开连接
                        </button>
                    </div>
                </div>

                <!-- Split Panel Body -->
                <div class="flex flex-1 overflow-hidden lab-split-body">

                    <!-- Left Panel: Experiment Documentation (30%) -->
                    <div class="flex flex-col border-r border-gray-200 lab-doc-panel" style="width: 30%; min-width: 0;">

                        <!-- Tab Switch: 网络实验 / 部署案例 -->
                        <div class="flex-shrink-0 flex border-b border-gray-200 px-2 pt-1 gap-1">
                            <button id="tab-experiments"
                                    class="tab-btn text-xs px-3 py-1.5 rounded-t font-medium border-b-2 border-k8s-blue text-k8s-blue bg-white">
                                网络实验
                            </button>
                            <button id="tab-deployments"
                                    class="tab-btn text-xs px-3 py-1.5 rounded-t font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700">
                                部署案例
                            </button>
                        </div>

                        <!-- Experiment Selector with Prev/Next navigation -->
                        <div class="flex-shrink-0 flex items-center px-2 py-2 bg-gray-50 border-b border-gray-200 gap-1">
                            <button id="btn-prev-exp" title="上一实验" disabled
                                    class="flex-shrink-0 p-1 text-gray-400 hover:text-k8s-blue disabled:opacity-30 disabled:cursor-not-allowed transition rounded">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                                </svg>
                            </button>
                            <select id="experiment-select"
                                    class="flex-1 text-sm bg-transparent text-gray-700 focus:outline-none cursor-pointer border-none min-w-0">
                                <option value="">-- 选择实验文档 --</option>
                            </select>
                            <button id="btn-next-exp" title="下一实验" disabled
                                    class="flex-shrink-0 p-1 text-gray-400 hover:text-k8s-blue disabled:opacity-30 disabled:cursor-not-allowed transition rounded">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                                </svg>
                            </button>
                            <span id="doc-loading-indicator" class="hidden flex-shrink-0">
                                <div class="loading" style="width:14px;height:14px;border-width:2px;"></div>
                            </span>
                        </div>

                        <!-- Experiment Info Bar (shown after selection) -->
                        <div id="doc-info-bar" class="hidden flex-shrink-0 px-3 py-1.5 bg-blue-50 border-b border-blue-100 flex items-center space-x-3 text-xs text-blue-700">
                            <span id="doc-info-difficulty"></span>
                            <span class="text-blue-300">|</span>
                            <span id="doc-info-duration"></span>
                        </div>

                        <!-- Jump-ahead warning (shown when user skips experiments via dropdown) -->
                        <div id="exp-jump-warning" class="hidden flex-shrink-0 px-3 py-2 bg-amber-50 border-b border-amber-200">
                            <div class="flex items-start gap-2 text-xs text-amber-800">
                                <svg class="w-3.5 h-3.5 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
                                    <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"/>
                                </svg>
                                <div class="flex-1">
                                    <span id="exp-jump-warning-text"></span>
                                    <div class="flex gap-3 mt-1.5">
                                        <button id="exp-jump-confirm" class="font-semibold text-amber-700 hover:text-amber-900 underline">仍要继续</button>
                                        <button id="exp-jump-cancel" class="text-gray-500 hover:text-gray-700">取消</button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Step Navigation (shown when experiment has step headings) -->
                        <div id="step-nav" class="hidden flex-shrink-0 border-b border-gray-200 bg-gray-50">
                            <div class="px-3 pt-2 pb-1">
                                <div class="flex items-center justify-between mb-1">
                                    <span class="text-xs font-medium text-gray-500">实验步骤</span>
                                    <span id="step-progress-text" class="text-xs text-gray-500">0/0 完成</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-1">
                                    <div id="step-progress-bar"
                                         class="bg-k8s-blue h-1 rounded-full transition-all duration-300"
                                         style="width:0%"></div>
                                </div>
                            </div>
                            <div id="step-pills" class="flex flex-wrap gap-1 px-3 pb-2 max-h-16 overflow-y-auto"></div>
                        </div>

                        <!-- Markdown Content Area -->
                        <div id="doc-content" class="doc-content flex-1 overflow-y-auto p-4 text-sm">
                            <div class="flex flex-col items-center justify-center h-full text-gray-400 space-y-3">
                                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                                </svg>
                                <p class="text-sm">从上方选择实验文档开始学习</p>
                            </div>
                        </div>
                    </div>

                    <!-- Middle Panel: Background + AI Tutor (25%) -->
                    <div id="ai-tutor-panel" class="flex flex-col border-r border-gray-200" style="width: 25%; min-width: 0;">

                        <!-- Panel Header -->
                        <div class="flex-shrink-0 flex items-center justify-between px-3 py-2 bg-indigo-50 border-b border-indigo-100">
                            <div class="flex items-center space-x-1.5">
                                <svg class="w-3.5 h-3.5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                                </svg>
                                <span class="text-xs font-medium text-indigo-700">AI 助教</span>
                            </div>
                            <button id="btn-clear-chat" title="清除对话记录"
                                    class="text-indigo-400 hover:text-indigo-600 transition text-xs px-1.5 py-0.5 rounded hover:bg-indigo-100">
                                清除
                            </button>
                        </div>

                        <!-- Tab: 背景 / 对话 -->
                        <div class="flex-shrink-0 flex border-b border-gray-100 text-xs">
                            <button id="ai-tab-bg" class="flex-1 py-1.5 font-medium text-indigo-600 border-b-2 border-indigo-500 bg-white">
                                案例背景
                            </button>
                            <button id="ai-tab-chat" class="flex-1 py-1.5 text-gray-500 hover:text-gray-700 border-b-2 border-transparent bg-white">
                                AI 对话
                            </button>
                        </div>

                        <!-- Background Sub-panel -->
                        <div id="ai-bg-panel" class="flex-1 overflow-y-auto p-3">
                            <div id="ai-bg-content" class="doc-content text-xs text-gray-600">
                                <div class="flex flex-col items-center justify-center h-full text-gray-400 space-y-2 pt-12">
                                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                    <p class="text-xs text-center">选择案例后显示背景介绍</p>
                                </div>
                            </div>
                        </div>

                        <!-- Chat Sub-panel -->
                        <div id="ai-chat-panel" class="hidden flex-col flex-1 overflow-hidden">
                            <!-- Message history -->
                            <div id="ai-chat-messages" class="flex-1 overflow-y-auto p-3 space-y-2 text-xs">
                                <div class="text-center text-gray-400 text-xs py-4">
                                    <p>有疑问？随时问我</p>
                                    <p class="mt-1 text-gray-300">仅回答 K8s 相关问题</p>
                                </div>
                            </div>

                            <!-- Input area -->
                            <div class="flex-shrink-0 border-t border-gray-100 p-2">
                                <div class="flex items-end gap-1.5">
                                    <textarea id="ai-chat-input" rows="2"
                                              placeholder="输入问题... (Enter 发送)"
                                              class="flex-1 text-xs px-2 py-1.5 border border-gray-200 rounded resize-none focus:outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200"></textarea>
                                    <button id="ai-chat-send"
                                            class="flex-shrink-0 bg-indigo-500 hover:bg-indigo-600 text-white px-2.5 py-1.5 rounded text-xs font-medium transition disabled:opacity-40 disabled:cursor-not-allowed">
                                        发送
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div><!-- end AI Tutor Panel -->

                    <!-- Right Panel: Terminal (45%) -->
                    <div class="flex flex-col lab-terminal-panel" style="width: 45%; min-width: 0;">

                        <!-- Terminal Title Bar (macOS style) -->
                        <div class="flex-shrink-0 flex items-center px-3 py-2 bg-gray-900 border-b border-gray-700">
                            <div class="flex space-x-1.5 mr-3">
                                <div class="w-2.5 h-2.5 rounded-full bg-red-500"></div>
                                <div class="w-2.5 h-2.5 rounded-full bg-yellow-500"></div>
                                <div class="w-2.5 h-2.5 rounded-full bg-green-500"></div>
                            </div>
                            <span class="text-xs text-gray-500">bash — k8s-netlab</span>
                            <button id="btn-reconnect-terminal"
                                    class="hidden ml-auto text-xs bg-green-700 hover:bg-green-600 text-white px-2.5 py-0.5 rounded transition">
                                ↻ 重新连接
                            </button>
                        </div>

                        <!-- xterm.js Terminal -->
                        <div class="terminal-container flex-1 overflow-hidden">
                            <div id="terminal" class="h-full"></div>
                        </div>
                    </div>

                </div><!-- end Split Panel Body -->
            </div><!-- end lab-panel -->
        </div><!-- end terminal-section -->
    </main>

    <!-- Loading Modal -->
    <div id="loading-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-sm mx-4">
            <div class="flex flex-col items-center">
                <div class="loading mb-4"></div>
                <p id="loading-text" class="text-gray-700 font-medium">处理中...</p>
                <p id="loading-subtext" class="text-sm text-gray-500 mt-2 text-center">请稍候</p>
            </div>
        </div>
    </div>

    <!-- Password Change Modal -->
    <div id="change-password-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center z-50">
        <div class="bg-white rounded-lg p-8 max-w-sm w-full mx-4 shadow-xl">
            <h2 class="text-lg font-semibold text-gray-900 mb-1">修改密码</h2>
            <p class="text-sm text-gray-500 mb-5">输入当前密码和新密码</p>
            <form id="change-password-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">当前密码</label>
                    <input type="password" id="cp-old" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-k8s-blue focus:border-transparent"
                           placeholder="输入当前密码">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">新密码</label>
                    <input type="password" id="cp-new" required minlength="6"
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-k8s-blue focus:border-transparent"
                           placeholder="至少6个字符">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">确认新密码</label>
                    <input type="password" id="cp-confirm" required
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-k8s-blue focus:border-transparent"
                           placeholder="再次输入新密码">
                </div>
                <div id="cp-error" class="hidden text-sm text-red-600"></div>
                <div id="cp-success" class="hidden text-sm text-green-600"></div>
                <div class="flex gap-3 pt-1">
                    <button type="submit"
                            class="flex-1 bg-k8s-blue hover:bg-blue-700 text-white font-medium py-2 rounded-lg text-sm transition">
                        确认修改
                    </button>
                    <button type="button" id="cp-cancel"
                            class="flex-1 border border-gray-300 text-gray-600 hover:bg-gray-50 font-medium py-2 rounded-lg text-sm transition">
                        取消
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/ui-init.js?v=20260326"></script>

    <!-- Scripts -->
    <script src="/js/api.js?v=20260223d"></script>
    <script src="/js/terminal.js?v=20260327"></script>
    <script src="/js/docs.js?v=20260223d"></script>
    <script src="/js/ai-tutor.js?v=20260606"></script>
    <script src="/js/app.js?v=20260327"></script>
</body>
</html>
