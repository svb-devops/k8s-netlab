<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8S NetLab — Kubernetes 网络学习实验平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
        .prose h1,.prose h2,.prose h3{font-weight:700;margin-top:1.5em;margin-bottom:.5em}
        .prose h1{font-size:1.5rem}.prose h2{font-size:1.2rem}.prose h3{font-size:1.05rem}
        .prose p{margin-bottom:1em;line-height:1.7}
        .prose ul,.prose ol{margin-left:1.5em;margin-bottom:1em}
        .prose li{margin-bottom:.3em}
        .prose code{background:#f1f5f9;padding:2px 6px;border-radius:4px;font-size:.875em}
        .prose pre{background:#1e293b;color:#e2e8f0;padding:1em;border-radius:.5rem;overflow-x:auto;margin-bottom:1em}
        .prose pre code{background:none;padding:0;color:inherit}
        .prose table{border-collapse:collapse;width:100%;margin-bottom:1em}
        .prose th,.prose td{border:1px solid #e2e8f0;padding:.5em .75em;text-align:left}
        .prose th{background:#f8fafc;font-weight:600}
        .prose blockquote{border-left:4px solid #3b82f6;padding-left:1em;color:#64748b;margin:1em 0;font-style:italic}
        .prose a{color:#3b82f6;text-decoration:underline}
    </style>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- Nav -->
<nav class="bg-white border-b border-gray-200 sticky top-0 z-10">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2 font-bold text-gray-900 text-lg">
            <svg class="w-7 h-7 text-blue-600" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            K8S NetLab
        </a>
        <div class="flex items-center gap-3" id="nav-actions">
            <!-- filled by JS -->
        </div>
    </div>
</nav>

<!-- Hero -->
<section class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white py-16 px-4">
    <div class="max-w-3xl mx-auto text-center">
        <h1 class="text-4xl font-bold mb-4">Kubernetes 网络实验平台</h1>
        <p class="text-blue-100 text-lg mb-8">真实 K3s 集群环境，动手掌握容器网络核心原理</p>
        <a id="hero-cta" href="/login.html"
           class="inline-block bg-white text-blue-700 font-semibold px-8 py-3 rounded-lg hover:bg-blue-50 transition">
            开始实验
        </a>
    </div>
</section>

<!-- Articles -->
<main class="max-w-3xl mx-auto px-4 py-12">
    <h2 class="text-2xl font-bold text-gray-900 mb-6">技术文章</h2>
    <div id="articles-list">
        <div class="text-gray-400 text-sm">加载中...</div>
    </div>
</main>

<!-- Footer -->
<footer class="text-center text-gray-400 text-sm py-8 border-t border-gray-200">
    © 2026 K8S NetLab · Kubernetes 网络学习实验平台
</footer>

<script>
const API = '/api/articles';

function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString('zh-CN', {year:'numeric', month:'long', day:'numeric'});
}

// Auth state
async function initNav() {
    try {
        const r = await fetch('/api/auth/me', {credentials:'include'});
        const nav = document.getElementById('nav-actions');
        const cta = document.getElementById('hero-cta');
        if (r.ok) {
            const data = await r.json();
            nav.innerHTML = `
                <span class="text-gray-600 text-sm">${escapeHtml(data.username)}</span>
                <a href="/app" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-1.5 rounded-lg transition">进入实验室</a>
            `;
            cta.href = '/app';
            cta.textContent = '进入实验室';
        } else {
            nav.innerHTML = `
                <a href="/login.html" class="text-gray-600 hover:text-gray-900 text-sm transition">登录</a>
                <a href="/login.html" class="bg-blue-600 hover:bg-blue-700 text-white text-sm px-4 py-1.5 rounded-lg transition">注册</a>
            `;
        }
    } catch (_) {}
}

async function loadArticles() {
    const container = document.getElementById('articles-list');
    try {
        const r = await fetch(API);
        if (!r.ok) throw new Error(r.status);
        const {articles} = await r.json();
        if (!articles.length) {
            container.innerHTML = '<p class="text-gray-400 text-sm">暂无文章</p>';
            return;
        }
        container.innerHTML = articles.map(a => `
            <article class="bg-white rounded-xl border border-gray-200 p-6 mb-4 hover:shadow-md transition cursor-pointer"
                     onclick="location.href='/article.html?slug=${escapeHtml(a.slug)}'">
                <h3 class="text-xl font-bold text-gray-900 mb-2">${escapeHtml(a.title)}</h3>
                ${a.excerpt ? `<p class="text-gray-600 text-sm leading-relaxed mb-3">${escapeHtml(a.excerpt)}</p>` : ''}
                <div class="flex items-center gap-3 text-xs text-gray-400">
                    <span>${formatDate(a.published_at)}</span>
                    <a href="/article.html?slug=${escapeHtml(a.slug)}"
                       class="text-blue-600 hover:underline font-medium">阅读全文 →</a>
                </div>
            </article>
        `).join('');
    } catch (e) {
        container.innerHTML = '<p class="text-red-400 text-sm">加载失败，请刷新重试</p>';
    }
}

initNav();
loadArticles();
</script>
</body>
</html>
