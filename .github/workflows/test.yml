name: Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # 提供 config.py 必填项的占位值（测试 mock 掉所有真实 Proxmox 调用）
      PROXMOX_HOST: "10.0.0.1"
      PROXMOX_TOKEN_ID: "ci@pam!ci-token"
      PROXMOX_TOKEN_SECRET: "00000000-0000-0000-0000-000000000000"
      VM_SSH_PASSWORD: "ci-placeholder"
      ADMIN_TOKEN: "ci-admin-token-placeholder-32chars!!"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.lock ruff mypy pip-tools pip-audit bandit

      - name: Verify lock file is up to date
        run: pip-compile requirements.txt -o /tmp/requirements.check --no-header --no-strip-extras --quiet && diff requirements.lock /tmp/requirements.check

      - name: Lint (ruff)
        run: ruff check backend/

      - name: Type check (mypy)
        run: mypy backend/ --ignore-missing-imports --warn-return-any --check-untyped-defs --no-error-summary

      - name: Security audit (pip-audit)
        # Ignored: pygments CVE-2026-4539 (no fix yet), pip/setuptools system-pkg CVEs (not in lockfile)
        run: pip-audit --ignore-vuln CVE-2026-4539 --ignore-vuln PYSEC-2023-228 --ignore-vuln CVE-2025-8869 --ignore-vuln CVE-2026-1703 --ignore-vuln PYSEC-2025-49 --ignore-vuln CVE-2024-6345

      - name: Static security analysis (bandit)
        # -lll = only report HIGH severity issues; medium/low are acceptable or nosec-annotated
        run: bandit -r backend/ -lll

      - name: Install Linux sandbox runner account
        # tests/test_labgen_linux_*.py (privilege separation, security regression)
        # call resolve_runner_identity() at module import time with no
        # try/except — without this account, pytest collection itself would
        # crash and fail every future CI run, not just Linux-domain ones.
        run: sudo bash scripts/install-labgen-linux-runner.sh

      - name: Run tests
        run: pytest tests/ -x -q --tb=short --cov=backend --cov-report=term-missing --cov-fail-under=90
